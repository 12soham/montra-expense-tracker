
spring.application.name=montra-backend

# Server
server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/montra_db
spring.datasource.username=postgres
spring.datasource.password=root123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
app.jwt.secret=${JWT_SECRET:MontraDevSecretKeyForJwtSigning2026Secure}
app.jwt.expiration-ms=86400000

# CORS configuration
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
